server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths fall back to the shell.
  location / { try_files $uri $uri/ /index.html; }

  # Proxy the API on the same origin so the console needs no CORS config and no
  # API host to be set at build time.
  location /v1/ {
    proxy_pass http://api:8000/v1/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # WebSocket for /v1/live
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;                    # long replays must not time out
  }
}
